services:
  notification-manager:
    build: .
    image: notification-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/app.db
    ports:
      - "8080:8080"
    volumes:
      - notification-data:/data
    # Give in-flight FCM sends time to finish (SHUTDOWN_TIMEOUT_MS defaults to 30s).
    stop_grace_period: 40s

volumes:
  notification-data:
